# Render blueprint — AIC Kijabe Hospital Queue
# Dashboard → New → Blueprint → pick this repo. Values marked sync:false are
# asked once at creation and can be edited later under Environment.
databases:
  - name: kijabe-careflow-db
    databaseName: kijabe_care_flow
    user: kijabe
    plan: free
    region: frankfurt

services:
  - type: web
    name: kijabe-careflow-queue
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/public/app-origin
    preDeployCommand: npm run db:bootstrap
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: kijabe-careflow-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MPESA_ENV
        value: production
      - key: MPESA_SHORTCODE
        value: "512900"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: VITE_PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
