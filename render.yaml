# Render blueprint — AIC Kijabe Hospital Queue
# Dashboard → New → Blueprint → pick this repo. Values marked sync:false are
# asked once at creation and can be edited later under Environment.
#
# The database is Neon Postgres (free tier, pooled connection string) rather
# than a Render database: Render's free Postgres expires after 30 days. The
# Free instance type does not support pre-deploy commands, so run
# `npm run db:bootstrap` once against DATABASE_URL before the first deploy.
services:
  - type: web
    name: kijabe-careflow-queue
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: (npm ci || npm install) && npm run build
    startCommand: npm start
    healthCheckPath: /api/public/app-origin
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: MPESA_ENV
        value: production
      - key: MPESA_SHORTCODE
        value: "512900"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: VITE_PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Staff mail (login codes, signup confirmations) goes out through Firebase
      # Auth, so no SMTP mailbox is required. Optional SMTP_HOST/PORT/USER/PASS,
      # MAIL_FROM and MAIL_FROM_NAME can be added in the dashboard later.
