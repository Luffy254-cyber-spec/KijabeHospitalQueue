<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Kijabe Care Flow — outpatient queue intelligence</title>
  <desc id="heroDesc">An animated deep-blue banner: a glowing ECG trace runs beneath the Care Flow wordmark, service stage chips pulse registration to pharmacy, and a live ticket card cycles the number now being served.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020d18"/>
      <stop offset="0.5" stop-color="#062033"/>
      <stop offset="1" stop-color="#0a2f4e"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#159ed5" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#159ed5"/>
      <stop offset="0.5" stop-color="#8be9ff"/>
      <stop offset="0.8" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#159ed5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="neonVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be9ff"/>
      <stop offset="0.5" stop-color="#159ed5"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#159ed5" stop-opacity="0.04"/>
      <stop offset="0.3" stop-color="#8be9ff"/>
      <stop offset="0.62" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#159ed5" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.2" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff">
        <animate attributeName="offset" values="-0.35;0.15;-0.35" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.35" stop-color="#c8f2ff">
        <animate attributeName="offset" values="0.05;0.55;0.05" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.65" stop-color="#7dd3fc">
        <animate attributeName="offset" values="0.45;0.95;0.45" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#eaf7ff">
        <animate attributeName="offset" values="0.75;1.25;0.75" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#159ed5" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#0c729c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0c729c" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d577a" stroke-width="1" opacity="0.38"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <clipPath id="frame">
      <rect width="1280" height="360"/>
    </clipPath>

    <path id="ecgPath" d="M0 322 H64 l12 0 10 -34 14 66 12 -32 16 0 H300 l12 0 11 -42 15 82 13 -40 18 0 H560 l12 0 10 -30 14 60 12 -30 16 0 H820 l12 0 10 -36 14 70 12 -34 18 0 H1040 l12 0 10 -26 14 52 12 -26 16 0 H1280"/>

    <style>
      .stream-a { stroke-dasharray: 180 300; animation: flow-a 9s linear infinite; }
      .stream-b { stroke-dasharray: 140 320; animation: flow-b 12s linear infinite; }
      .ecg-trace { stroke-dasharray: 150 1500; animation: ecg-flow 5.2s linear infinite; }
      .dot { animation: dot-pulse 2.6s ease-in-out infinite; }
      .breath { animation: breath 4.2s ease-in-out infinite; }
      .blink { animation: breath 1.6s ease-in-out infinite; }
      .chip { animation: chip 4.4s ease-in-out infinite; }
      .chip-1 { animation-delay: 0s; }
      .chip-2 { animation-delay: 1.1s; }
      .chip-3 { animation-delay: 2.2s; }
      .chip-4 { animation-delay: 3.3s; }
      .drift { animation: drift 7s ease-in-out infinite; }
      .sheen { animation: sheen 3.4s linear infinite; }
      .scan { animation: scan 7.5s linear infinite; }
      .num { animation: num-cycle 9s steps(1, end) infinite; }

      @keyframes flow-a { to { stroke-dashoffset: -960; } }
      @keyframes flow-b { to { stroke-dashoffset: 920; } }
      @keyframes ecg-flow { to { stroke-dashoffset: -1650; } }
      @keyframes breath {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes dot-pulse {
        0%, 100% { r: 3.4; opacity: 0.7; }
        50% { r: 5.4; opacity: 1; }
      }
      @keyframes chip {
        0%, 100% { opacity: 0.42; }
        12% { opacity: 1; }
        38% { opacity: 0.42; }
      }
      @keyframes drift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes sheen {
        0% { transform: translateX(-60px); opacity: 0; }
        15% { opacity: 0.85; }
        60% { opacity: 0; }
        100% { transform: translateX(300px); opacity: 0; }
      }
      @keyframes scan {
        0% { transform: translateX(-260px); opacity: 0; }
        12% { opacity: 0.55; }
        55% { opacity: 0.2; }
        100% { transform: translateX(1420px); opacity: 0; }
      }
      @keyframes num-cycle {
        0%, 32% { opacity: 1; }
        33.4%, 100% { opacity: 0; }
      }
      @keyframes num-cycle-2 {
        0%, 32% { opacity: 0; }
        33.4%, 65% { opacity: 1; }
        66.4%, 100% { opacity: 0; }
      }
      @keyframes num-cycle-3 {
        0%, 65% { opacity: 0; }
        66.4%, 99% { opacity: 1; }
        100% { opacity: 0; }
      }
      .num-2 { animation-name: num-cycle-2; }
      .num-3 { animation-name: num-cycle-3; }

      @media (prefers-reduced-motion: reduce) {
        .stream-a, .stream-b, .ecg-trace, .dot, .breath, .blink, .chip, .drift, .sheen, .scan, .num {
          animation: none;
        }
        .num-2, .num-3 { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>

    <ellipse class="breath" cx="1020" cy="176" rx="330" ry="190" fill="url(#halo)"/>

    <g class="scan">
      <rect x="0" y="0" width="110" height="360" fill="#39c6ff" opacity="0.07"/>
      <rect x="108" y="0" width="1.6" height="360" fill="#8be9ff" opacity="0.4"/>
    </g>

    <path class="stream-a" d="M-40 40 C 220 10, 380 72, 640 44 S 1080 4, 1320 48" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
    <path class="stream-b" d="M-40 330 C 240 354, 420 288, 660 314 S 1060 356, 1320 310" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.8"/>

    <use href="#ecgPath" fill="none" stroke="url(#ecg)" stroke-width="8" opacity="0.45" filter="url(#softGlow)"/>
    <use href="#ecgPath" fill="none" stroke="url(#ecg)" stroke-width="1.8" opacity="0.55"/>
    <use class="ecg-trace" href="#ecgPath" fill="none" stroke="#c8f7ff" stroke-width="2.6" filter="url(#glow)"/>

    <circle class="dot" r="4.2" fill="#eafcff" filter="url(#glow)">
      <animateMotion dur="5.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#ecgPath"/>
      </animateMotion>
    </circle>
    <circle r="10" fill="none" stroke="#8be9ff" stroke-width="1.4" opacity="0.55">
      <animateMotion dur="5.2s" repeatCount="indefinite">
        <mpath href="#ecgPath"/>
      </animateMotion>
      <animate attributeName="r" values="7;13;7" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="64" y="82" fill="#6fd2f5" font-size="12.5" font-weight="600" letter-spacing="7.5">AIC KIJABE HOSPITAL</text>
      <text x="912" y="44" fill="#4f9dbe" font-size="10.5" letter-spacing="5">QUEUE // LIVE</text>
      <circle class="blink" cx="898" cy="40" r="3.2" fill="#7cf5d5"/>
    </g>

    <g font-family="Bahnschrift, 'Segoe UI Variable Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="58" y="172" fill="url(#ink)" font-size="74" font-weight="800" letter-spacing="-1">CARE FLOW</text>
    </g>

    <g font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif">
      <text x="66" y="212" fill="#8fd8f5" font-size="23" font-style="italic" letter-spacing="0.4">Health Care to God’s Glory.</text>
    </g>

    <g font-family="'Public Sans', 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif">
      <text x="66" y="244" fill="#9fc9e2" font-size="15.5" letter-spacing="0.4">Outpatient queue intelligence — registration to pharmacy, in real time.</text>
    </g>

    <g font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="2.4">
      <g class="chip chip-1">
        <rect x="66" y="272" width="150" height="30" rx="15" fill="#0b3350" stroke="#2e7fa5" stroke-width="1"/>
        <circle cx="86" cy="287" r="3.4" fill="#7cf5d5"/>
        <text x="98" y="291" fill="#a8dcf3">REGISTRATION</text>
      </g>
      <g class="chip chip-2">
        <rect x="230" y="272" width="112" height="30" rx="15" fill="#0b3350" stroke="#2e7fa5" stroke-width="1"/>
        <circle cx="250" cy="287" r="3.4" fill="#8be9ff"/>
        <text x="262" y="291" fill="#a8dcf3">TRIAGE</text>
      </g>
      <g class="chip chip-3">
        <rect x="356" y="272" width="122" height="30" rx="15" fill="#0b3350" stroke="#2e7fa5" stroke-width="1"/>
        <circle cx="376" cy="287" r="3.4" fill="#8be9ff"/>
        <text x="388" y="291" fill="#a8dcf3">CONSULT</text>
      </g>
      <g class="chip chip-4">
        <rect x="492" y="272" width="132" height="30" rx="15" fill="#0b3350" stroke="#2e7fa5" stroke-width="1"/>
        <circle cx="512" cy="287" r="3.4" fill="#7cf5d5"/>
        <text x="524" y="291" fill="#a8dcf3">PHARMACY</text>
      </g>
      <g stroke="#1f6a8c" stroke-width="1.2" fill="none" opacity="0.9">
        <path d="M216 287 h10"/>
        <path d="M342 287 h10"/>
        <path d="M478 287 h10"/>
      </g>
    </g>

    <g class="drift">
      <g transform="translate(922 92)">
        <rect width="290" height="176" rx="22" fill="#07253b" stroke="url(#neonVertical)" stroke-width="1.7" filter="url(#glow)"/>
        <rect x="12" y="12" width="266" height="152" rx="15" fill="none" stroke="#1d577a" stroke-width="1" opacity="0.85"/>

        <g font-family="'Cascadia Mono', Consolas, 'Courier New', monospace">
          <text x="34" y="44" fill="#7dd3fc" font-size="10.5" letter-spacing="4.4">NOW SERVING</text>
          <text x="34" y="132" fill="#8fe3ff" font-size="11" letter-spacing="2.2">ROOM 12 · OPD</text>
          <text x="34" y="152" fill="#5b93ad" font-size="9.5" letter-spacing="1.6">WAITING · 04</text>
        </g>

        <g font-family="Bahnschrift, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#f2fbff" letter-spacing="1">
          <text class="num num-1" x="30" y="104">A-024</text>
          <text class="num num-2" x="30" y="104">A-025</text>
          <text class="num num-3" x="30" y="104">A-026</text>
        </g>

        <g transform="translate(206 44)">
          <rect x="-4" y="-6" width="72" height="40" fill="#0a2d45"/>
          <g fill="#8fd8f5" opacity="0.75">
            <rect x="0" y="0" width="2" height="28"/>
            <rect x="4" y="0" width="1" height="28"/>
            <rect x="7" y="0" width="3" height="28"/>
            <rect x="12" y="0" width="1" height="28"/>
            <rect x="15" y="0" width="2" height="28"/>
            <rect x="19" y="0" width="4" height="28"/>
            <rect x="25" y="0" width="1" height="28"/>
            <rect x="28" y="0" width="2" height="28"/>
            <rect x="32" y="0" width="1" height="28"/>
            <rect x="35" y="0" width="3" height="28"/>
            <rect x="40" y="0" width="1" height="28"/>
            <rect x="43" y="0" width="2" height="28"/>
            <rect x="47" y="0" width="4" height="28"/>
            <rect x="53" y="0" width="1" height="28"/>
            <rect x="56" y="0" width="2" height="28"/>
            <rect x="60" y="0" width="1" height="28"/>
            <rect x="63" y="0" width="3" height="28"/>
          </g>
          <rect class="sheen" x="-4" y="-6" width="26" height="40" fill="#c8f7ff" opacity="0.3"/>
        </g>

        <g fill="none" stroke="#159ed5" stroke-width="2" opacity="0.9">
          <path d="M0 88 h16"/>
          <path d="M274 88 h16"/>
        </g>
        <g stroke="#1d577a" stroke-dasharray="3 5" opacity="0.5" stroke-width="1">
          <path d="M20 148 h250"/>
        </g>

        <circle class="blink" cx="258" cy="36" r="4.2" fill="#7cf5d5"/>
      </g>
    </g>

    <g fill="none" stroke="#159ed5" stroke-width="1.4">
      <circle class="breath" cx="866" cy="74" r="8" opacity="0.55"/>
      <circle class="breath" cx="884" cy="300" r="12" opacity="0.4" style="animation-duration:6s"/>
      <circle class="breath" cx="712" cy="252" r="5" opacity="0.5"/>
    </g>
    <g fill="#9be9ff">
      <circle cx="866" cy="74" r="2.4"/>
      <circle cx="884" cy="300" r="3"/>
      <circle cx="712" cy="252" r="2"/>
    </g>

    <g fill="#8be9ff">
      <circle cx="640" cy="92" r="1.8" opacity="0.7">
        <animate attributeName="cy" values="92;76;92" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="150" r="1.4" opacity="0.5">
        <animate attributeName="cy" values="150;132;150" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="604" cy="212" r="1.6" opacity="0.45">
        <animate attributeName="cy" values="212;196;212" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="9.5" letter-spacing="3">
      <text x="66" y="342" fill="#3f7e9c">KIJABE · KIAMBU · KENYA</text>
      <text x="1214" y="342" text-anchor="end" fill="#3f7e9c">EST. CARE, EVERY DAY</text>
    </g>
  </g>
</svg>
